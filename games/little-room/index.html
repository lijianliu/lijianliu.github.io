<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Room · Playtime</title><meta name="description" content="A little room full of big adventures. Explore a playful interactive 3D bedroom."><link rel="stylesheet" href="style.css"></head><body>
<div id="game" aria-label="Interactive 3D bedroom"></div><header><a class="brand" href="./"><span class="brand-icon">✳</span> little room<span class="edition">PLAYTIME</span></a><div class="header-actions"><button id="sound" aria-label="Enable sound">Sound off</button><button id="reset" title="Start again">↻ <span>Reset</span></button></div></header>
<section class="intro"><div class="eyebrow">YOUR OWN LITTLE WORLD</div><h1>Big adventures.<br>Small room.</h1><p>Pick a toy. Make a little magic.</p></section>
<aside class="discover"><div class="discover-top"><span>Little discoveries</span><strong id="count">0 / 8</strong></div><div class="progress"><i id="progress"></i></div><div id="discoveries"></div><p id="mission">There’s something to do in every corner.</p></aside>
<div id="tip" role="status">Click an object to play with it</div><div id="hover"></div>
<footer><div class="controls"><span class="keys">W A S D</span><span>or arrow keys to move</span><b>·</b><span>Click objects to play</span></div><div class="view-controls"><button id="rotateL" aria-label="Rotate view left">↶</button><span>VIEW</span><button id="rotateR" aria-label="Rotate view right">↷</button></div></footer>
<div class="touch-pad" aria-label="Movement controls"><button data-key="ArrowUp" aria-label="Move forward">↑</button><div><button data-key="ArrowLeft" aria-label="Move left">←</button><button data-key="ArrowDown" aria-label="Move backward">↓</button><button data-key="ArrowRight" aria-label="Move right">→</button></div></div><div class="object-access"><label for="object">Explore a toy</label><select id="object"><option value="">Choose an object…</option></select><button id="play">Play ↗</button></div>
<script type="module" src="game.js"></script></body></html>
